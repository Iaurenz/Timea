<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Verborgene Hinweise</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin: 0;
  padding: 40px;
  font-family: "Georgia", serif;
  background: url("hintergrund.jpg.webp") center/cover no-repeat fixed;
  color: white;
}

h2, p {
  text-align: center;
  text-shadow: 0 0 8px black;
}

/* Wand */
.wall {
  position: relative;
  max-width: 1200px;
  margin: 40px auto;
  height: 900px; /* ⬅️ mehr Platz, keine Überlappung */
}

/* Rahmen */
.frame {
  position: absolute;
  width: 220px;
  height: 300px;
  padding: 14px;
  background: #3b2a18;
  box-shadow:
    0 14px 25px rgba(0,0,0,0.75),
    inset 0 0 0 6px #c9a24d,
    inset 0 0 0 10px #8a6a2f;
}

/* Bild im Rahmen */
.frame img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  background: #111;
}

/* feste, saubere Positionen */
.pos1 { top: 40px;  left: 80px; }
.pos2 { top: 120px; left: 360px; }
.pos3 { top: 60px;  left: 700px; }

.pos4 { top: 480px; left: 120px; } /* ⬅️ weiter unten */
.pos5 { top: 520px; left: 460px; }
.pos6 { top: 460px; left: 820px; }

/* Versteckter Link */
.secret {
  position: absolute;
  width: 180px;
  height: 140px;
  bottom: 40px;
  right: 40px;
  cursor: pointer;
}
</style>
</head>

<body>

<h2>Finde den verborgenen Hinweis</h2>
<p>Die Wand schweigt – doch ein Detail führt dich weiter.</p>

<div class="wall">

  <div class="frame pos1"><img src="Bild 1.jpg"></div>
  <div class="frame pos2"><img src="Bild 2.jpg"></div>
  <div class="frame pos3"><img src="Bild 3.jpg"></div>

  <div class="frame pos4"><img src="Bild 4.jpg"></div>
  <div class="frame pos5"><img src="Bild 5.jpg"></div>

  <!-- 🔐 Weiterleitung -->
  <div class="secret" onclick="location.href='binär.html'"></div>

</div>

</body>
</html>
