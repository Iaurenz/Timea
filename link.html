<<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Verborgene Hinweise</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: url('hintergrund.jpg.webp') no-repeat center center fixed;
      background-size: cover;
      text-align: center;
      padding: 30px;
      color: white;
    }

    h2, p {
      text-shadow: 0 0 8px rgba(0,0,0,0.7);
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 20px;
      margin-top: 30px;
      width: 95%;
      margin-left: auto;
      margin-right: auto;
    }

    .frame {
      border: 8px solid #d2b48c; /* Holzrahmen */
      border-radius: 8px;
      box-shadow: 0 0 15px rgba(0,0,0,0.4);
      cursor: pointer;
      background-color: #fff8dc;
      padding: 5px;
    }

    .frame img {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 4px;
    }

    /* Fast unsichtbarer Bereich für den Download */
    .hiddenArea {
      width: 100%;
      height: 150px;
      background-color: rgba(255,255,255,0.03);
      cursor: pointer;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1) inset;
    }
  </style>
</head>
<body>

  <h2>🎨 Finde den verborgenen Hinweis</h2>
  <p>Irgendwo auf dieser Seite ist der nächste Schritt versteckt... Klick herum!</p>

  <div class="gallery">

    <!-- 10 Bilder -->
    <div class="frame"><img src="Bild 1.jpg" alt="Gemälde 1"></div>
    <div class="frame"><img src="Bild 2.jpg" alt="Gemälde 2"></div>

    <!-- Versteckter Bereich (Download-Link) -->
    <div class="hiddenArea" onclick="window.location.href='geheim.pdf'"></div>

    <div class="frame"><img src="Bild 3.jpg" alt="Gemälde 3"></div>
    <div class="frame"><img src="Bild 4.jpg" alt="Gemälde 4"></div>
    <div class="frame"><img src="Bild 5.jpg" alt="Gemälde 5"></div>
    <div class="frame"><img src="Bild 6.jpg" alt="Gemälde 6"></div>
    <div class="frame"><img src="Bild 7.jpg" alt="Gemälde 7"></div>
    <div class="frame"><img src="Bild 8.jpg" alt="Gemälde 8"></div>
    <div class="frame"><img src="Bild 9.jpg" alt="Gemälde 9"></div>
    <div class="frame"><img src="Bild 10.jpg" alt="Gemälde 10"></div>

  </div>

</body>
</html>
